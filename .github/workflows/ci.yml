name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        # ubuntu-latest runners don't ship the shared libraries PySide6's
        # QtGui needs to import at all, even under the offscreen platform
        # (e.g. libEGL.so.1) - without these, pytest-qt fails at
        # collection time before any test runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Unit tests (no gmx required)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not requires_gmx" -v
