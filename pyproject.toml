[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gromacs-gui"
version = "0.1.0"
description = "A desktop GUI that wraps GROMACS molecular dynamics simulation setup and execution"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Francisco Baldera" }]
dependencies = [
    "PySide6>=6.9",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "MDAnalysis>=2.7",
]

[project.scripts]
gromacs-gui = "gromacs_gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-qt>=4.5",
    "pytest-mock>=3.15",
    "ruff>=0.16",
    "black>=26.0",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gromacs_gui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gmx: test needs a real gmx binary on PATH/configured",
    "slow: test takes more than a couple seconds",
]
qt_api = "pyside6"
